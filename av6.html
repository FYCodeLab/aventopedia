<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Calendriers de l'Avent 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&family=Passion+One:wght@700;900&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #17151d;
  --paper: #fbf5e8;
  --cream: #fffaf5;
  --yellow: #ffd84d;
  --pink: #ff78aa;
  --violet: #6f5cff;
  --mint: #a8e6cf;
  --border: 3px solid var(--ink);
  --shadow: 6px 6px 0 var(--ink);
  --display: "Passion One", Impact, "Arial Black", sans-serif;
  --ui: "Inter", system-ui, -apple-system, sans-serif;
}

* { box-sizing: border-box; }

html, body {
  width: 100vw;
  height: 100dvh;
  margin: 0;
  padding: 0;
  overflow: hidden !important;
  overscroll-behavior: none;
  position: fixed;
  inset: 0;
}

body {
  color: var(--ink);
  background:
    linear-gradient(rgba(20,33,61,.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(20,33,61,.05) 1px, transparent 1px), var(--paper);
  background-size: 24px 24px;
  font-family: var(--ui);
  letter-spacing: -.012em;
  user-select: none;
}

button, a { -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; border: none; background: none; }

.app {
  width: 100vw;
  height: 100dvh;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  overflow: hidden;
  position: relative;
}

/* --- Header --- */
.topbar {
  padding: clamp(6px, 1.2vh, 10px) 10px 4px;
  overflow: visible;
  display: flex;
  flex-direction: column;
  gap: 6px;
  position: relative;
  z-index: 50;
}

.brandline { display: block; min-width: 0; }
.year {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-family: var(--display);
  text-transform: uppercase;
}
.year strong {
  font-family: var(--ui);
  font-size: clamp(.6rem, 1vw, .85rem);
  font-weight: 900;
  line-height: .9;
  letter-spacing: -.04em;
  background: var(--yellow);
  border: 2px solid var(--ink);
  padding: .3em .5em;
  box-shadow: 3px 3px 0 var(--ink);
  transform: rotate(-1.2deg);
  white-space: nowrap;
}
.year span {
  font-family: var(--display);
  font-size: clamp(1.2rem, 4vw, 3rem);
  line-height: .8;
  letter-spacing: -.04em;
  text-align: right;
  border-bottom: 3px solid var(--pink);
  font-weight: 900;
  white-space: nowrap;
}

/* Navigation & Search */
.filterline {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  width: 100%;
  min-width: 0;
  position: relative;
}

.themes {
  display: flex;
  gap: 4px;
  flex: 1;
  min-width: 0;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 2px 0;
  align-items: center;
}
.themes::-webkit-scrollbar { display: none; }

.theme {
  border: 2px solid var(--ink);
  border-radius: 12px;
  background: var(--cream);
  padding: 3px 6px;
  font-family: var(--ui);
  font-weight: 800;
  font-size: clamp(.52rem, 1.4vw, .68rem);
  line-height: 1.05;
  text-align: center;
  white-space: normal;
  cursor: pointer;
  box-shadow: 2px 2px 0 var(--ink);
  transition: all 0.12s ease;
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
}
.theme:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--ink); }
.theme.active {
  background: var(--ink);
  color: #fff;
  box-shadow: 2px 2px 0 var(--pink);
}

.filterline.searching .themes { display: none; }

.search-toggle {
  border: 2px solid var(--ink);
  border-radius: 12px;
  background: var(--pink);
  padding: 4px 10px;
  font-weight: 900;
  font-size: clamp(1rem, 2vw, 1.2rem);
  line-height: 1;
  cursor: pointer;
  box-shadow: 2px 2px 0 var(--ink);
  white-space: nowrap;
  flex: 0 0 auto;
  display: grid;
  place-items: center;
}
.filterline.searching .search-toggle { display: none; }

.search-form-container {
  display: none;
  flex: 1;
  position: relative;
  min-width: 0;
}
.filterline.searching .search-form-container {
  display: flex;
  gap: 6px;
  align-items: center;
}

.search-input {
  width: 100%;
  border: 2px solid var(--ink);
  border-radius: 999px;
  padding: 5px 12px;
  font-family: var(--ui);
  font-weight: 800;
  font-size: 0.75rem;
  outline: none;
  background: #fff;
  box-shadow: 2px 2px 0 var(--ink);
}

.close-search {
  border: 2px solid var(--ink);
  border-radius: 50%;
  background: var(--yellow);
  width: 28px;
  height: 28px;
  display: grid;
  place-items: center;
  font-weight: 900;
  font-size: 0.75rem;
  cursor: pointer;
  box-shadow: 2px 2px 0 var(--ink);
  flex: 0 0 auto;
}

.search-results-list {
  display: none;
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  right: 0;
  background: var(--cream);
  border: var(--border);
  border-radius: 12px;
  box-shadow: var(--shadow);
  padding: 6px;
  z-index: 100;
  max-height: 220px;
  overflow-y: auto;
  flex-direction: column;
  gap: 4px;
}
.filterline.searching .search-results-list { display: flex; }

.search-result-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 10px;
  border-radius: 6px;
  border: 1.5px solid var(--ink);
  background: #fff;
  cursor: pointer;
  font-size: 0.7rem;
  font-weight: 800;
  text-decoration: none;
  color: inherit;
}
.search-result-item:hover { background: var(--yellow); }
.search-result-item .item-price { font-weight: 900; color: var(--violet); }

/* --- Main Stage --- */
.stage {
  position: relative;
  min-height: 0;
  width: 100vw;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}

.card {
  width: 100vw;
  max-width: 100%;
  height: 100%;
  max-height: 620px;
  display: grid;
  grid-template-columns: minmax(0, 1.25fr) minmax(200px, 0.75fr);
  border: var(--border);
  border-left: none;
  border-right: none;
  background: var(--cream);
  overflow: hidden;
  position: relative;
  z-index: 10;
}

.visual {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  border-right: var(--border);
  overflow: hidden;
  text-decoration: none;
  color: inherit;
  padding: 12px;
  min-width: 0;
  min-height: 0;
  background: linear-gradient(135deg, #ff77aa, #ffab90);
}

.visual-img {
  max-width: 90%;
  max-height: 90%;
  object-fit: contain;
  border: 3px solid var(--ink);
  box-shadow: 5px 5px 0 var(--ink);
  border-radius: 12px;
  background: #fff;
}

/* Détails */
.details {
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  padding: clamp(10px, 2vw, 18px);
  min-width: 0;
  background: var(--cream);
}

.kicker {
  display: inline-block;
  width: max-content;
  max-width: 100%;
  border: 1.5px solid var(--ink);
  background: var(--mint);
  padding: 2px 6px;
  font-size: 0.55rem;
  font-weight: 900;
  line-height: 1.1;
  letter-spacing: 0.02em;
  margin-top: 0;
  margin-bottom: 6px;
  transform: rotate(-1deg);
  box-shadow: 1.5px 1.5px 0 var(--ink);
  text-transform: uppercase;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

h1 {
  font-family: var(--display);
  font-size: clamp(1.1rem, 2.2vw, 1.8rem);
  line-height: .95;
  letter-spacing: -.03em;
  margin: 0 0 8px 0;
  text-transform: uppercase;
}

.desc {
  font-size: clamp(.6rem, 0.95vw, .72rem);
  font-weight: 700;
  line-height: 1.25;
  margin: 0 0 10px 0;
  color: #333;
}

.price {
  font-family: var(--display);
  font-size: clamp(1.1rem, 1.8vw, 1.4rem);
  line-height: .85;
  margin-bottom: 10px;
  color: var(--ink);
}

.info {
  align-self: flex-start;
  text-decoration: none;
  border: 2px solid var(--ink);
  background: var(--violet);
  color: white;
  box-shadow: 3px 3px 0 var(--ink);
  padding: 6px 12px;
  font-weight: 900;
  font-size: 0.7rem;
  border-radius: 999px;
  transition: .12s ease;
}
.info:hover {
  transform: translate(1px, 1px);
  box-shadow: 1.5px 1.5px 0 var(--ink);
  background: var(--pink);
}

/* Flèches intégrées */
.arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  z-index: 40;
  width: 34px;
  height: 34px;
  border: 2.5px solid var(--ink);
  border-radius: 50%;
  background: var(--yellow);
  box-shadow: 2px 2px 0 var(--ink);
  display: grid;
  place-items: center;
  font-family: var(--display);
  font-size: 1rem;
  font-weight: 900;
  cursor: pointer;
  transition: transform 0.12s, box-shadow 0.12s;
}
.arrow:hover {
  transform: translateY(-50%) translate(1px, 1px);
  box-shadow: 1px 1px 0 var(--ink);
}
.arrow.prev { left: 4px; }
.arrow.next { right: 4px; }

/* --- Footer --- */
.footer {
  padding: 4px 10px calc(4px + env(safe-area-inset-bottom));
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: clamp(.45rem, .8vw, .55rem);
  opacity: 0.8;
  width: 100%;
}
.footer-left { text-align: left; }
.footer-right { text-align: right; }
.footer a { color: inherit; text-decoration: underline; font-weight: 900; }

@media (max-width: 720px) {
  .topbar { padding: 4px 6px 2px; }
  
  .stage { padding: 0; }
  .card {
    grid-template-columns: 1fr;
    grid-template-rows: minmax(0, 1fr) auto;
    border-radius: 0;
  }
  .visual { border-right: 0; border-bottom: var(--border); padding: 6px; }
  
  .details {
    padding: 8px 10px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    grid-template-areas:
      "kicker price"
      "title price"
      "desc info";
    gap: 4px 6px;
    align-items: center;
  }
  .kicker {
    grid-area: kicker;
    margin: 0 0 2px 0;
    font-size: .48rem;
    padding: 2px 5px;
    align-self: start;
  }
  h1 { grid-area: title; font-size: clamp(.85rem, 3.8vw, 1.1rem) !important; margin: 0; line-height: .9; }
  .desc { grid-area: desc; font-size: clamp(.45rem, 1.7vw, .55rem); line-height: 1.1; margin: 0; }
  .price { grid-area: price; margin: 0; font-size: clamp(.8rem, 3.5vw, 1rem); text-align: right; }
  .info { grid-area: info; padding: 4px 8px; font-size: .5rem; border-width: 1.5px; box-shadow: 1.5px 1.5px 0 var(--ink); white-space: nowrap; }
  
  .arrow { width: 30px; height: 30px; font-size: .85rem; border-width: 2px; }
  .arrow.prev { left: 4px; }
  .arrow.next { right: 4px; }
}
</style>
</head>

let filtered = [...calendars], index = 0;

const visualLink = document.getElementById('visualLink');
const visualImg = document.getElementById('visualImg');
const title = document.getElementById('title');
const kicker = document.getElementById('kicker');
const price = document.getElementById('price');
const desc = document.getElementById('desc');
const infoLink = document.getElementById('infoLink');

function render() {
  const c = filtered[index] || calendars[0];
  visualImg.src = c.img;
  visualImg.alt = c.title;
  title.textContent = c.title;
  kicker.textContent = c.theme;
  price.textContent = c.price;
  desc.textContent = c.desc;
  visualLink.href = c.url;
  infoLink.href = c.url;
}

function move(step) {
  index = (index + step + filtered.length) % filtered.length;
  render();
}

document.getElementById('prev').onclick = () => move(-1);
document.getElementById('next').onclick = () => move(1);

const filterline = document.getElementById('filterline');
const searchToggle = document.getElementById('searchToggle');
const closeSearch = document.getElementById('closeSearch');
const searchInput = document.getElementById('searchInput');
const searchResultsList = document.getElementById('searchResultsList');

searchToggle.addEventListener('click', () => {
  filterline.classList.add('searching');
  searchInput.focus();
  updateSearchResults();
});

closeSearch.addEventListener('click', () => {
  filterline.classList.remove('searching');
  searchInput.value = '';
});

function updateSearchResults() {
  const q = searchInput.value.trim().toLowerCase();
  const matches = calendars.filter(c => 
    [c.theme, c.mainTheme, c.title, c.desc].join(' ').toLowerCase().includes(q)
  );

  searchResultsList.innerHTML = '';
  if (matches.length === 0) {
    searchResultsList.innerHTML = '<div style="font-size:0.65rem; padding:6px; opacity:0.75">Aucun résultat trouvé</div>';
    return;
  }

  matches.forEach(c => {
    const item = document.createElement('div');
    item.className = 'search-result-item';
    item.innerHTML = `<span>${c.title} (${c.theme})</span> <span class="item-price">${c.price}</span>`;
    item.onclick = () => {
      filtered = [c];
      index = 0;
      render();
      filterline.classList.remove('searching');
    };
    searchResultsList.appendChild(item);
  });
}

searchInput.addEventListener('input', updateSearchResults);

document.querySelectorAll('.theme').forEach(btn => btn.addEventListener('click', () => {
  document.querySelectorAll('.theme').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const t = btn.dataset.theme;
  filtered = t === 'Tous' ? [...calendars] : calendars.filter(c => c.mainTheme === t);
  if (!filtered.length) filtered = [...calendars];
  index = 0;
  render();
}));

window.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') move(-1);
  if (e.key === 'ArrowRight') move(1);
});

let x = null;
window.addEventListener('touchstart', e => x = e.touches[0].clientX, {passive: true});
window.addEventListener('touchend', e => {
  if (x === null) return;
  const dx = e.changedTouches[0].clientX - x;
  if (Math.abs(dx) > 45) move(dx < 0 ? 1 : -1);
  x = null;
}, {passive: true});

render();
</script>
