<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Calendriers de l'Avent 2026</title>

<style>
:root {
  --ink: #17151d;
  --paper: #fbf5e8;
  --cream: #fffaf5;
  --yellow: #ffd84d;
  --pink: #ff78aa;
  --violet: #6f5cff;
  --mint: #a8e6cf;
  --border: 3px solid var(--ink);
  --shadow: 6px 6px 0 var(--ink);
  --display: "Passion One", Impact, "Arial Black", sans-serif;
  --ui: "Inter", system-ui, -apple-system, sans-serif;
}

* { box-sizing: border-box; }

html, body {
  width: 100vw;
  height: 100dvh;
  margin: 0;
  padding: 0;
  overflow: hidden !important;
  overscroll-behavior: none;
  position: fixed;
  inset: 0;
}

body {
  color: var(--ink);
  background:
    linear-gradient(rgba(20,33,61,.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(20,33,61,.05) 1px, transparent 1px), var(--paper);
  background-size: 24px 24px;
  font-family: var(--ui);
  letter-spacing: -.012em;
  user-select: none;
}

button, a { -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; border: none; background: none; }

.app {
  width: 100vw;
  height: 100dvh;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  overflow: hidden;
  position: relative;
}

/* --- Header --- */
.topbar {
  padding: clamp(6px, 1vh, 10px) 10px 4px;
  overflow: visible;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  position: relative;
  z-index: 50;
  width: 100%;
}

.brandline { 
  display: flex;
  justify-content: center;
  width: 100%;
}

.year {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-family: var(--display);
  text-transform: uppercase;
}
.year strong {
  font-family: var(--ui);
  font-size: clamp(.55rem, 1vw, .85rem);
  font-weight: 900;
  line-height: .9;
  letter-spacing: -.04em;
  background: var(--yellow);
  border: 2px solid var(--ink);
  padding: .25em .4em;
  box-shadow: 2px 2px 0 var(--ink);
  transform: rotate(-1.2deg);
  white-space: nowrap;
}
.year span {
  font-family: var(--display);
  font-size: clamp(1.1rem, 3.5vw, 2.5rem);
  line-height: .8;
  letter-spacing: -.04em;
  text-align: center;
  border-bottom: 3px solid var(--pink);
  font-weight: 900;
  white-space: nowrap;
}

/* Navigation & Search */
.filterline {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  width: 100%;
  max-width: 900px;
  position: relative;
}

.themes {
  display: flex;
  gap: 6px;
  align-items: center;
  justify-content: center;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 2px 0;
  max-width: 100%;
}
.themes::-webkit-scrollbar { display: none; }

.theme {
  border: 2px solid var(--ink);
  border-radius: 10px;
  background: var(--cream);
  padding: 3px 8px;
  font-family: var(--ui);
  font-weight: 800;
  font-size: clamp(.55rem, 1.2vw, .7rem);
  line-height: 1.05;
  text-align: center;
  white-space: normal;
  cursor: pointer;
  box-shadow: 2px 2px 0 var(--ink);
  transition: all 0.12s ease;
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
}
.theme:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--ink); }
.theme.active {
  background: var(--ink);
  color: #fff;
  box-shadow: 2px 2px 0 var(--pink);
}

.filterline.searching .themes { display: none; }

.search-toggle {
  border: 2px solid var(--ink);
  border-radius: 10px;
  background: var(--pink);
  padding: 3px 8px;
  font-weight: 900;
  font-size: clamp(.9rem, 1.8vw, 1.1rem);
  line-height: 1;
  cursor: pointer;
  box-shadow: 2px 2px 0 var(--ink);
  white-space: nowrap;
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  transition: all 0.12s ease;
}
.search-toggle.active {
  background: var(--ink);
  color: #fff;
  box-shadow: 2px 2px 0 var(--pink);
}
.filterline.searching .search-toggle { display: none; }

.search-form-container {
  display: none;
  flex: 1;
  position: relative;
  min-width: 0;
}
.filterline.searching .search-form-container {
  display: flex;
  gap: 6px;
  align-items: center;
}

.search-input {
  width: 100%;
  border: 2px solid var(--ink);
  border-radius: 999px;
  padding: 4px 10px;
  font-family: var(--ui);
  font-weight: 800;
  font-size: 0.75rem;
  outline: none;
  background: #fff;
  box-shadow: 2px 2px 0 var(--ink);
}

.close-search {
  border: 2px solid var(--ink);
  border-radius: 50%;
  background: var(--yellow);
  width: 26px;
  height: 26px;
  display: grid;
  place-items: center;
  font-weight: 900;
  font-size: 0.75rem;
  cursor: pointer;
  box-shadow: 2px 2px 0 var(--ink);
  flex: 0 0 auto;
}

.search-results-list {
  display: none;
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  right: 0;
  background: var(--cream);
  border: var(--border);
  border-radius: 12px;
  box-shadow: var(--shadow);
  padding: 6px;
  z-index: 100;
  max-height: 200px;
  overflow-y: auto;
  flex-direction: column;
  gap: 4px;
}
.filterline.searching .search-results-list { display: flex; }

.search-result-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 5px 8px;
  border-radius: 6px;
  border: 1.5px solid var(--ink);
  background: #fff;
  cursor: pointer;
  font-size: 0.68rem;
  font-weight: 800;
  text-decoration: none;
  color: inherit;
}
.search-result-item:hover { background: var(--yellow); }
.search-result-item .item-price { font-weight: 900; color: var(--violet); }

/* --- Main Stage --- */
.stage {
  position: relative;
  min-height: 0;
  width: 100vw;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}

.card {
  width: 100vw;
  max-width: 100%;
  height: 100%;
  display: grid;
  grid-template-columns: 70% 30%;
  border: var(--border);
  border-left: none;
  border-right: none;
  background: var(--cream);
  overflow: hidden;
  position: relative;
  z-index: 10;
}

/* Zone rose (Gauche - 70%) */
.visual {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-right: var(--border);
  overflow: hidden;
  padding: 8px 12px;
  min-width: 0;
  min-height: 0;
  background: linear-gradient(135deg, #ff77aa, #ffab90);
  cursor: default;
}

.visual-link {
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 1;
  height: 100%;
  max-height: 90%;
  text-decoration: none;
  min-width: 0;
}

.visual-img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  border: 3px solid var(--ink);
  box-shadow: 4px 4px 0 var(--ink);
  border-radius: 12px;
  background: #fff;
  cursor: pointer;
}

/* Zone détails (Droite - 30%) */
.details {
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: clamp(8px, 1.5vw, 16px);
  min-width: 0;
  background: var(--cream);
}

.kicker {
  display: inline-block;
  width: max-content;
  max-width: 100%;
  border: 1.5px solid var(--ink);
  background: var(--mint);
  padding: 2px 6px;
  font-size: 0.55rem;
  font-weight: 900;
  line-height: 1.1;
  letter-spacing: 0.02em;
  margin-top: 0;
  margin-bottom: 6px;
  transform: rotate(-1deg);
  box-shadow: 1.5px 1.5px 0 var(--ink);
  text-transform: uppercase;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

h1 {
  font-family: var(--display);
  font-size: clamp(1rem, 2vw, 1.6rem);
  line-height: .95;
  letter-spacing: -.03em;
  margin: 0 0 6px 0;
  text-transform: uppercase;
}

.desc {
  font-size: clamp(.55rem, 0.9vw, .7rem);
  font-weight: 700;
  line-height: 1.25;
  margin: 0 0 8px 0;
  color: #333;
}

.price {
  font-family: var(--display);
  font-size: clamp(1rem, 1.6vw, 1.3rem);
  line-height: .85;
  margin-bottom: 8px;
  color: var(--ink);
}

.info {
  align-self: flex-start;
  text-decoration: none;
  border: 2px solid var(--ink);
  background: var(--violet);
  color: white;
  box-shadow: 2.5px 2.5px 0 var(--ink);
  padding: 5px 10px;
  font-weight: 900;
  font-size: 0.65rem;
  border-radius: 999px;
  transition: .12s ease;
  cursor: pointer;
}
.info:hover {
  transform: translate(1px, 1px);
  box-shadow: 1.5px 1.5px 0 var(--ink);
  background: var(--pink);
}

/* Flèches de navigation */
.arrow {
  position: relative;
  z-index: 40;
  width: 44px;
  height: 44px;
  border: 4px solid var(--ink);
  border-radius: 50%;
  background: var(--yellow);
  box-shadow: 3.5px 3.5px 0 var(--ink);
  display: grid;
  place-items: center;
  font-family: var(--ui);
  font-size: 1.35rem;
  font-weight: 900;
  -webkit-text-stroke: 1.2px var(--ink);
  cursor: pointer;
  flex-shrink: 0;
  transition: transform 0.12s, box-shadow 0.12s;
  align-self: center;
}
.arrow:hover {
  transform: translate(1px, 1px);
  box-shadow: 2px 2px 0 var(--ink);
}

/* --- Footer --- */
.footer {
  padding: 2px 10px calc(2px + env(safe-area-inset-bottom));
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: clamp(.45rem, .8vw, .55rem);
  opacity: 0.8;
  width: 100%;
}
.footer-left { text-align: left; }
.footer-right { text-align: right; }
.footer a { color: inherit; text-decoration: underline; font-weight: 900; }

/* 📱 MOBILE PORTRAIT */
@media (max-width: 720px) and (orientation: portrait) {
  .topbar { padding: 4px 6px 2px; }

  .year {
    justify-content: center;
  }
  .year span {
    text-align: center;
  }

  .filterline {
    justify-content: center;
    gap: 4px;
  }
  
  .themes {
    justify-content: center;
    flex: initial;
    gap: 4px;
  }

  /* Reduced upper button font size to avoid overlap */
  .theme {
    font-size: clamp(0.48rem, 2.2vw, 0.58rem);
    padding: 2px 5px;
    border-radius: 8px;
  }
  
  .card {
    grid-template-columns: 1fr;
    grid-template-rows: auto 1fr;
    border-radius: 0;
  }
  
  .visual {
    border-right: 0;
    border-bottom: var(--border);
    padding: 6px 8px;
    height: 40vh;
  }
  
  /* Padded bottom slightly so content does not touch bottom border */
  .details {
    padding: 8px 10px 18px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 4px;
  }
  .kicker {
    margin: 0 0 2px 0;
    font-size: .48rem;
    padding: 2px 5px;
    align-self: center;
  }
  h1 { 
    font-size: clamp(.85rem, 3.8vw, 1.1rem) !important; 
    margin: 0; 
    line-height: .9; 
    text-align: center;
  }
  .desc { 
    font-size: clamp(.45rem, 1.7vw, .55rem); 
    line-height: 1.1; 
    margin: 0; 
    text-align: center;
  }
  .price { 
    margin: 0; 
    font-size: clamp(.8rem, 3.5vw, 1rem); 
    text-align: center; 
  }
  .info { 
    align-self: center;
    padding: 4px 8px; 
    font-size: .5rem; 
    border-width: 1.5px; 
    box-shadow: 1.5px 1.5px 0 var(--ink); 
    white-space: nowrap; 
  }
  
  .arrow { 
    width: 38px; 
    height: 38px; 
    font-size: 1.1rem; 
    border-width: 3.5px;
    -webkit-text-stroke: 1px var(--ink);
  }
}

/* 📱 MOBILE PAYSAGE (Orientation Landscape) */
@media (max-height: 550px) and (orientation: landscape) {
  .topbar { padding: 2px 8px; }
  .year span { font-size: 1.2rem; }
  .theme { padding: 1px 5px; font-size: 0.5rem; }
  
  .card {
    grid-template-columns: 70% 30%;
    grid-template-rows: 1fr;
  }

  .visual {
    border-right: var(--border);
    border-bottom: none;
    height: 100%;
    padding: 6px 10px;
  }

  .details {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 6px 10px;
  }

  h1 { font-size: clamp(0.75rem, 2.5vh, 1rem) !important; margin-bottom: 3px; }
  .desc { font-size: clamp(0.45rem, 1.8vh, 0.6rem); margin-bottom: 4px; line-height: 1.1; }
  .price { font-size: clamp(0.75rem, 2.2vh, 0.95rem); margin-bottom: 6px; }
  .info { padding: 3px 8px; font-size: 0.5rem; }

  .arrow { 
    width: 34px; 
    height: 34px; 
    font-size: 0.95rem; 
    border-width: 3px;
    -webkit-text-stroke: 0.8px var(--ink);
  }
}
</style>

let filtered = [...calendars];
let index = Math.floor(Math.random() * calendars.length);
let currentSearchResults = [];

const visualLink = document.getElementById('visualLink');
const visualImg = document.getElementById('visualImg');
const title = document.getElementById('title');
const kicker = document.getElementById('kicker');
const price = document.getElementById('price');
const desc = document.getElementById('desc');
const infoLink = document.getElementById('infoLink');

function render() {
  const c = filtered[index] || calendars[0];
  visualImg.src = c.img;
  visualImg.alt = c.title;
  title.textContent = c.title;
  kicker.textContent = c.theme;
  price.textContent = c.price;
  desc.textContent = c.desc;
  visualLink.href = c.url;
  infoLink.href = c.url;
}

function move(step) {
  if (!filtered.length) return;
  index = (index + step + filtered.length) % filtered.length;
  render();
}

document.getElementById('prev').onclick = () => move(-1);
document.getElementById('next').onclick = () => move(1);

const filterline = document.getElementById('filterline');
const searchToggle = document.getElementById('searchToggle');
const closeSearch = document.getElementById('closeSearch');
const searchInput = document.getElementById('searchInput');
const searchResultsList = document.getElementById('searchResultsList');

searchToggle.addEventListener('click', () => {
  filterline.classList.add('searching');
  searchInput.focus();
  updateSearchResults();
});

closeSearch.addEventListener('click', () => {
  filterline.classList.remove('searching');
  searchInput.value = '';
});

function updateSearchResults() {
  const q = searchInput.value.trim().toLowerCase();
  currentSearchResults = calendars.filter(c => 
    [c.theme, c.mainTheme, c.title, c.desc].join(' ').toLowerCase().includes(q)
  );

  searchResultsList.innerHTML = '';
  if (currentSearchResults.length === 0) {
    searchResultsList.innerHTML = '<div style="font-size:0.65rem; padding:6px; opacity:0.75">Aucun résultat trouvé</div>';
    return;
  }

  currentSearchResults.forEach((c, i) => {
    const item = document.createElement('div');
    item.className = 'search-result-item';
    item.innerHTML = `<span>${c.title} (${c.theme})</span> <span class="item-price">${c.price}</span>`;
    item.onclick = () => {
      filtered = [...currentSearchResults];
      index = i;
      render();
      
      document.querySelectorAll('.theme').forEach(b => b.classList.remove('active'));
      searchToggle.classList.add('active');
      
      filterline.classList.remove('searching');
    };
    searchResultsList.appendChild(item);
  });
}

searchInput.addEventListener('input', updateSearchResults);

document.querySelectorAll('.theme').forEach(btn => btn.addEventListener('click', () => {
  document.querySelectorAll('.theme').forEach(b => b.classList.remove('active'));
  searchToggle.classList.remove('active');
  btn.classList.add('active');
  const t = btn.dataset.theme;
  filtered = t === 'Tous' ? [...calendars] : calendars.filter(c => c.mainTheme === t);
  if (!filtered.length) filtered = [...calendars];
  index = 0;
  render();
}));

window.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') move(-1);
  if (e.key === 'ArrowRight') move(1);
});

let x = null;
window.addEventListener('touchstart', e => x = e.touches[0].clientX, {passive: true});
window.addEventListener('touchend', e => {
  if (x === null) return;
  const dx = e.changedTouches[0].clientX - x;
  if (Math.abs(dx) > 45) move(dx < 0 ? 1 : -1);
  x = null;
}, {passive: true});

render();
</script>
